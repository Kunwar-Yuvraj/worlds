command:
  - node_modules/.bin/next
  - start
  - -H
  - 0.0.0.0
  - -p
  - $DATABRICKS_APP_PORT

env:
  - name: FIREBASE_SERVICE_ACCOUNT
    valueFrom: firebase_service_account
  - name: NEXT_PUBLIC_FIREBASE_API_KEY
    valueFrom: firebase_api_key
  - name: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    valueFrom: firebase_auth_domain
  - name: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    valueFrom: firebase_project_id
  - name: NEXT_PUBLIC_FIREBASE_APP_ID
    valueFrom: firebase_app_id
  - name: LLM_PROVIDER
    valueFrom: llm_provider
  - name: GEMINI_API_KEY
    valueFrom: gemini_api_key
  - name: GEMINI_MODEL
    valueFrom: gemini_model
  - name: OPENAI_API_KEY
    valueFrom: openai_api_key
  - name: TTS_MODEL
    valueFrom: tts_model
